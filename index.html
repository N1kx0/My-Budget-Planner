<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>My-Budget-Planner</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #0b1329;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #334155;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 16px 12px 60px 12px;
    }

    .app-container {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    /* Systemuhr Badges */
    .clock-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      padding: 0 4px;
    }

    .badge {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    /* Modus-Umschalter: Monat / Jahr */
    .view-toggle {
      display: flex;
      background: var(--bg-card);
      padding: 4px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .toggle-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px 0;
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .toggle-btn.active {
      background: var(--accent);
      color: #fff;
    }

    /* KPI Dashboard */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .kpi-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .kpi-value {
      font-size: 1.05rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .kpi-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Segmentierte Progress Bar */
    .progress-bar-wrapper {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
    }

    .progress-track {
      height: 14px;
      background: var(--bg-input);
      border-radius: 7px;
      overflow: hidden;
      display: flex;
      width: 100%;
    }

    .progress-segment {
      height: 100%;
      transition: width 0.3s ease;
    }

    /* Basis Card Layout */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Listen-Elemente: Einkommen & Ausgaben */
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(255, 255, 255, 0.02);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .item-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .item-name-input {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 600;
      flex: 1;
      outline: none;
    }

    .item-name-input:focus {
      border-bottom: 1px solid var(--accent);
    }

    .item-inputs {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .number-input-wrapper {
      position: relative;
      width: 105px;
    }

    .number-input-wrapper input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-main);
      padding: 6px 22px 6px 8px;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: right;
      outline: none;
    }

    .number-input-wrapper input:focus {
      border-color: var(--accent);
    }

    .currency-symbol {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.85rem;
      pointer-events: none;
    }

    /* Schieberegler Styling (Cross-Browser + iOS Fixes) */
    .range-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--bg-input);
      outline: none;
      margin: 6px 0;
    }

    .range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
      border: 2px solid var(--accent);
    }

    .range-slider::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
      border: 2px solid var(--accent);
    }

    /* Sparziel-Box */
    .goal-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--bg-input);
      padding: 10px;
      border-radius: 8px;
    }

    .goal-stat-item {
      display: flex;
      flex-direction: column;
    }

    .goal-stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .goal-stat-val {
      font-size: 0.95rem;
      font-weight: 700;
    }

    /* Editor-Modus & Buttons */
    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: none;
      cursor: pointer;
      padding: 4px;
      font-size: 1rem;
    }

    .editor-only {
      display: none !important;
    }

    body.editor-active .editor-only {
      display: flex !important;
    }

    .color-picker-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      padding: 0;
      background: none;
      -webkit-appearance: none;
    }

    .footer-actions {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <main class="app-container">
    
    <!-- 1. Offline Hardware-Systemuhr -->
    <header class="clock-row">
      <span class="badge" id="dateBadge">--.--.----</span>
      <span class="badge" id="timeBadge">--:--:--</span>
    </header>

    <!-- 2. Umschalter: Monat / Jahr -->
    <div class="view-toggle">
      <button type="button" class="toggle-btn active" id="btnMonth">Monat</button>
      <button type="button" class="toggle-btn" id="btnYear">Jahr (x12)</button>
    </div>

    <!-- 3. KPI Dashboard -->
    <section class="kpi-grid">
      <div class="kpi-card">
        <span class="kpi-title">Ausgaben</span>
        <span class="kpi-value" id="kpiExpenses">0,00 €</span>
        <span class="kpi-sub" id="subExpenses">pro Monat</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-title">Überschuss</span>
        <span class="kpi-value" id="kpiSurplus">0,00 €</span>
        <span class="kpi-sub" id="subSurplus">pro Monat</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-title">Sparquote</span>
        <span class="kpi-value" id="kpiSavingsRate">0,0 %</span>
        <span class="kpi-sub">Gesamt</span>
      </div>
    </section>

    <!-- 4. Dynamischer Fortschrittsbalken -->
    <section class="progress-bar-wrapper">
      <div class="progress-track" id="progressBar"></div>
    </section>

    <!-- 5. Einnahmen & Konten (Multi-Account) -->
    <section class="card">
      <div class="card-header">
        <h2 class="card-title">💵 Einnahmen & Konten</h2>
        <span id="totalIncomeHeader" style="font-size: 0.95rem; font-weight: 700; color: var(--success);">0,00 €</span>
      </div>
      <div class="item-list" id="incomesList"></div>
      <button type="button" class="btn btn-secondary editor-only" id="btnAddIncome">+ Einkommen / Konto hinzufügen</button>
    </section>

    <!-- 6. Dynamische Ausgabenkategorien -->
    <div id="categoriesContainer" style="display: flex; flex-direction: column; gap: 16px;"></div>

    <button type="button" class="btn btn-secondary editor-only" id="btnAddCategory">+ Neue Ausgabenkategorie</button>

    <!-- 7. Sparziel mit Zinseszins & Prognose -->
    <section class="card" id="savingsGoalCard">
      <div class="card-header">
        <h2 class="card-title" id="goalTitleDisplay">🎯 Sparziel</h2>
        <span id="goalTargetDisplay" style="font-size: 0.95rem; font-weight: 700; color: var(--accent);">0,00 €</span>
      </div>

      <div class="goal-stats">
        <div class="goal-stat-item">
          <span class="goal-stat-label">Endsummen-Prognose:</span>
          <span class="goal-stat-val" id="goalForecastVal">0,00 €</span>
        </div>
        <div class="goal-stat-item">
          <span class="goal-stat-label">Benötigt mtl.:</span>
          <span class="goal-stat-val" id="goalRequiredRate">0,00 €</span>
        </div>
        <div class="goal-stat-item" style="grid-column: span 2; margin-top: 4px;">
          <span class="goal-stat-label">Verbleibende Monate:</span>
          <span class="goal-stat-val" id="goalRemainingMonths">0 Monate</span>
        </div>
      </div>

      <!-- Editor-Felder für Sparziel -->
      <div class="editor-only" style="flex-direction: column; gap: 8px;">
        <label style="font-size: 0.75rem; color: var(--text-muted);">Titel: <input type="text" id="goalTitleInput" style="background:var(--bg-input); border:1px solid var(--border); color:#fff; padding:4px; border-radius:4px; width:100%;"></label>
        <label style="font-size: 0.75rem; color: var(--text-muted);">Zielbetrag (€): <input type="number" id="goalTargetInput" style="background:var(--bg-input); border:1px solid var(--border); color:#fff; padding:4px; border-radius:4px; width:100%;"></label>
        <label style="font-size: 0.75rem; color: var(--text-muted);">Startkapital (€): <input type="number" id="goalStartInput" style="background:var(--bg-input); border:1px solid var(--border); color:#fff; padding:4px; border-radius:4px; width:100%;"></label>
        <label style="font-size: 0.75rem; color: var(--text-muted);">Zieldatum: <input type="date" id="goalDateInput" style="background:var(--bg-input); border:1px solid var(--border); color:#fff; padding:4px; border-radius:4px; width:100%;"></label>
        <label style="font-size: 0.75rem; color: var(--text-muted);">Tagesgeldzins (% p.a.): <input type="number" step="0.1" id="goalRateInput" style="background:var(--bg-input); border:1px solid var(--border); color:#fff; padding:4px; border-radius:4px; width:100%;"></label>
      </div>
    </section>

    <!-- 8. Modus-Umschaltung & Reset -->
    <footer class="footer-actions">
      <button type="button" class="btn" id="btnToggleMode">⚙️ Editor-Modus</button>
      <button type="button" class="btn btn-secondary editor-only" id="btnResetDemo" style="color: var(--danger); border-color: var(--danger);">Reset auf 0 €</button>
    </footer>

  </main>

  <script>
    /* ==========================================================================
       1. Globale Zustände & Datenstruktur (Schema)
       ========================================================================== */
    const STORAGE_KEY = 'budget_app_blank_v10';
    let currentViewMode = 'month'; // 'month' oder 'year'
    let isEditorActive = false;

    // Standard-Template für Initialisierung oder Reset
    function getDefaultData() {
      return {
        incomes: [
          { id: 'inc_1', name: 'Gehalt 1', value: 2500 },
          { id: 'inc_2', name: 'Gehalt 2', value: 1500 }
        ],
        categories: [
          {
            id: 'cat_wohnen',
            name: 'Wohnen & Fixkosten',
            color: '#3b82f6',
            items: [
              { id: 'item_miete', name: 'Warmmiete', value: 950, max: 2000 },
              { id: 'item_strom', name: 'Strom & Gas', value: 120, max: 500 },
              { id: 'item_internet', name: 'Internet & GEZ', value: 65, max: 200 }
            ]
          },
          {
            id: 'cat_leben',
            name: 'Lebenshaltung & Alltag',
            color: '#10b981',
            items: [
              { id: 'item_lebensmittel', name: 'Lebensmittel', value: 450, max: 1000 },
              { id: 'item_drogerie', name: 'Drogerie & Haushaltsbedarf', value: 80, max: 300 }
            ]
          },
          {
            id: 'cat_mobil',
            name: 'Mobilität & Transport',
            color: '#f59e0b',
            items: [
              { id: 'item_kfz', name: 'KFZ Versicherung & Steuer', value: 85, max: 300 },
              { id: 'item_sprit', name: 'Tanken / ÖPNV-Ticket', value: 140, max: 400 }
            ]
          }
        ],
        savingsGoal: {
          visible: true,
          title: 'Notgroschen & Eigenkapital',
          target: 15000,
          startCapital: 3000,
          targetDate: '2028-12-31',
          interestRate: 3.5,
          color: '#8b5cf6'
        }
      };
    }

    /* ==========================================================================
       2. Update-sicheres Laden & Schema-Migration
       ========================================================================== */
    function loadAndMigrateData() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return getDefaultData();

      try {
        const stored = JSON.parse(raw);
        const defaults = getDefaultData();

        // Migration: Fehlendes Einnahmen-Array aus Altdaten nachrüsten
        if (!Array.isArray(stored.incomes)) {
          stored.incomes = stored.totalIncome 
            ? [{ id: 'inc_legacy', name: 'Haupteinkommen', value: stored.totalIncome }]
            : defaults.incomes;
        }

        // Migration: Kategorien sicherstellen
        if (!Array.isArray(stored.categories)) {
          stored.categories = defaults.categories;
        } else {
          // Fehlende Standard-Felder in Items nachziehen
          stored.categories.forEach(cat => {
            if (!cat.color) cat.color = '#3b82f6';
            if (Array.isArray(cat.items)) {
              cat.items.forEach(it => {
                if (typeof it.value !== 'number') it.value = 0;
                if (!it.max || it.max < it.value) it.max = Math.max(1000, it.value * 1.5);
              });
            }
          });
        }

        // Migration: Sparziel sicherstellen
        if (!stored.savingsGoal) {
          stored.savingsGoal = defaults.savingsGoal;
        }

        return stored;
      } catch (e) {
        console.error("Migration fehlgeschlagen, lade Standardwerte:", e);
        return getDefaultData();
      }
    }

    let state = loadAndMigrateData();

    function persistState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    /* ==========================================================================
       3. Rechnerische Hilfsfunktionen
       ========================================================================== */
    function getMultiplier() {
      return currentViewMode === 'year' ? 12 : 1;
    }

    function formatEUR(val) {
      return (val || 0).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
    }

    function calcMonthlyIncome() {
      return (state.incomes || []).reduce((sum, inc) => sum + (Number(inc.value) || 0), 0);
    }

    function calcMonthlyExpenses() {
      let sum = 0;
      (state.categories || []).forEach(cat => {
        (cat.items || []).forEach(item => {
          sum += (Number(item.value) || 0);
        });
      });
      return sum;
    }

    /* ==========================================================================
       4. Render-Pipeline (Dashboard, KPIs, Balken)
       ========================================================================== */
    function renderKPIs() {
      const mult = getMultiplier();
      const mIncome = calcMonthlyIncome();
      const mExpenses = calcMonthlyExpenses();
      const mSurplus = mIncome - mExpenses;
      const savingsRate = mIncome > 0 ? (mSurplus / mIncome) * 100 : 0;

      // Dashboard Cards
      document.getElementById('kpiExpenses').textContent = formatEUR(mExpenses * mult);
      document.getElementById('kpiSurplus').textContent = formatEUR(mSurplus * mult);
      document.getElementById('kpiSavingsRate').textContent = `${savingsRate.toFixed(1)} %`;

      const surplusEl = document.getElementById('kpiSurplus');
      surplusEl.style.color = mSurplus >= 0 ? 'var(--success)' : 'var(--danger)';

      const labelSuffix = currentViewMode === 'year' ? 'pro Jahr' : 'pro Monat';
      document.getElementById('subExpenses').textContent = labelSuffix;
      document.getElementById('subSurplus').textContent = labelSuffix;

      // Gesamteinnahmen in Header
      document.getElementById('totalIncomeHeader').textContent = formatEUR(mIncome * mult);

      // Fortschrittsbalken rendern
      renderProgressBar(mIncome, mExpenses);

      // Sparziel neu berechnen
      renderSavingsGoal(mSurplus);
    }

    function renderProgressBar(mIncome, mExpenses) {
      const track = document.getElementById('progressBar');
      track.innerHTML = '';
      if (mIncome <= 0 || mExpenses <= 0) return;

      const base = Math.max(mIncome, mExpenses);

      state.categories.forEach(cat => {
        const catSum = (cat.items || []).reduce((s, it) => s + (Number(it.value) || 0), 0);
        if (catSum > 0) {
          const pct = (catSum / base) * 100;
          const seg = document.createElement('div');
          seg.className = 'progress-segment';
          seg.style.width = `${pct}%`;
          seg.style.backgroundColor = cat.color || '#3b82f6';
          track.appendChild(seg);
        }
      });
    }

    /* ==========================================================================
       5. Render: Einkommen & Konten
       ========================================================================== */
    function renderIncomes() {
      const container = document.getElementById('incomesList');
      container.innerHTML = '';
      const mult = getMultiplier();

      state.incomes.forEach((inc, idx) => {
        const row = document.createElement('div');
        row.className = 'item-row';

        const displayedValue = (inc.value * mult).toFixed(2);

        row.innerHTML = `
          <div class="item-info">
            <input type="text" class="item-name-input" value="${inc.name}" ${!isEditorActive ? 'readonly' : ''}>
            <div class="item-inputs">
              <div class="number-input-wrapper">
                <input type="number" step="any" value="${displayedValue}">
                <span class="currency-symbol">€</span>
              </div>
              <button type="button" class="btn-danger editor-only">🗑️</button>
            </div>
          </div>
        `;

        const nameInput = row.querySelector('.item-name-input');
        const numInput = row.querySelector('input[type="number"]');
        const delBtn = row.querySelector('.btn-danger');

        nameInput.addEventListener('change', (e) => {
          inc.name = e.target.value;
          persistState();
        });

        numInput.addEventListener('input', (e) => {
          const raw = parseFloat(e.target.value) || 0;
          inc.value = currentViewMode === 'year' ? (raw / 12) : raw;
          persistState();
          renderKPIs();
        });

        delBtn.addEventListener('click', () => {
          state.incomes.splice(idx, 1);
          persistState();
          renderApp();
        });

        container.appendChild(row);
      });
    }

    /* ==========================================================================
       6. Render: Ausgaben-Kategorien & Schieberegler
       ========================================================================== */
    function renderCategories() {
      const container = document.getElementById('categoriesContainer');
      container.innerHTML = '';
      const mult = getMultiplier();

      state.categories.forEach((cat, cIdx) => {
        const card = document.createElement('section');
        card.className = 'card';

        const catSum = (cat.items || []).reduce((s, it) => s + (Number(it.value) || 0), 0) * mult;

        card.innerHTML = `
          <div class="card-header">
            <div style="display: flex; align-items: center; gap: 8px;">
              <input type="color" class="color-picker-dot editor-only" value="${cat.color}">
              <h2 class="card-title">
                <input type="text" class="item-name-input" value="${cat.name}" ${!isEditorActive ? 'readonly' : ''} style="font-size: 1.05rem; font-weight: 700;">
              </h2>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span class="cat-sum-badge" style="font-size: 0.95rem; font-weight: 700;">${formatEUR(catSum)}</span>
              <button type="button" class="btn-danger editor-only del-cat-btn">🗑️</button>
            </div>
          </div>
          <div class="item-list"></div>
          <button type="button" class="btn btn-secondary editor-only add-item-btn">+ Posten hinzufügen</button>
        `;

        const list = card.querySelector('.item-list');
        const colorPicker = card.querySelector('input[type="color"]');
        const titleInput = card.querySelector('.item-name-input');
        const delCatBtn = card.querySelector('.del-cat-btn');
        const addItemBtn = card.querySelector('.add-item-btn');

        colorPicker.addEventListener('input', (e) => {
          cat.color = e.target.value;
          persistState();
          renderApp();
        });

        titleInput.addEventListener('change', (e) => {
          cat.name = e.target.value;
          persistState();
        });

        delCatBtn.addEventListener('click', () => {
          state.categories.splice(cIdx, 1);
          persistState();
          renderApp();
        });

        addItemBtn.addEventListener('click', () => {
          cat.items.push({ id: `item_${Date.now()}`, name: 'Neuer Posten', value: 0, max: 500 });
          persistState();
          renderApp();
        });

        // Items der Kategorie rendern
        cat.items.forEach((item, iIdx) => {
          const itemRow = document.createElement('div');
          itemRow.className = 'item-row';

          const displayedVal = (item.value * mult).toFixed(2);
          const currentMax = (item.max * mult);

          itemRow.innerHTML = `
            <div class="item-info">
              <input type="text" class="item-name-input" value="${item.name}" ${!isEditorActive ? 'readonly' : ''}>
              <div class="item-inputs">
                <div class="number-input-wrapper">
                  <input type="number" step="any" value="${displayedVal}">
                  <span class="currency-symbol">€</span>
                </div>
                <button type="button" class="btn-danger editor-only del-item-btn">🗑️</button>
              </div>
            </div>
            <input type="range" class="range-slider" min="0" max="${currentMax}" step="1" value="${displayedVal}">
          `;

          const nameInp = itemRow.querySelector('.item-name-input');
          const numInp = itemRow.querySelector('input[type="number"]');
          const slider = itemRow.querySelector('input[type="range"]');
          const delItemBtn = itemRow.querySelector('.del-item-btn');

          // Dynamische Farbe für den Regler
          slider.style.accentColor = cat.color || 'var(--accent)';

          // Bidirektionale Synchronisation (Zahleneingabe & Slider)
          const syncValues = (newDisplayedVal) => {
            let numeric = parseFloat(newDisplayedVal) || 0;
            
            // Automatische Skalenerweiterung des Schiebereglers
            if (numeric > (item.max * mult)) {
              item.max = Math.ceil(currentViewMode === 'year' ? (numeric / 12) * 1.25 : numeric * 1.25);
              slider.max = (item.max * mult);
            }

            // Sicher als Monatswert im State persistieren
            item.value = currentViewMode === 'year' ? (numeric / 12) : numeric;
            persistState();

            // Ansichten synchron halten
            numInp.value = numeric;
            slider.value = numeric;

            // Live-Berechnung ohne DOM-Neuaufbau
            renderKPIs();
            card.querySelector('.cat-sum-badge').textContent = formatEUR(
              cat.items.reduce((s, it) => s + (Number(it.value) || 0), 0) * mult
            );
          };

          slider.addEventListener('input', (e) => syncValues(e.target.value));
          numInp.addEventListener('input', (e) => syncValues(e.target.value));

          nameInp.addEventListener('change', (e) => {
            item.name = e.target.value;
            persistState();
          });

          delItemBtn.addEventListener('click', () => {
            cat.items.splice(iIdx, 1);
            persistState();
            renderApp();
          });

          list.appendChild(itemRow);
        });

        container.appendChild(card);
      });
    }

    /* ==========================================================================
       7. Sparziel-Berechnung (Zinseszins & Monatsrate)
       ========================================================================== */
    function renderSavingsGoal(monthlySurplus) {
      const g = state.savingsGoal;
      const card = document.getElementById('savingsGoalCard');
      if (!g || !g.visible) {
        card.style.display = 'none';
        return;
      }
      card.style.display = 'flex';

      document.getElementById('goalTitleDisplay').textContent = `🎯 ${g.title}`;
      document.getElementById('goalTargetDisplay').textContent = formatEUR(g.target);

      // Verbleibende Restmonate berechnen
      const today = new Date();
      const targetDate = new Date(g.targetDate || '2028-12-31');
      let diffMonths = (targetDate.getFullYear() - today.getFullYear()) * 12 + (targetDate.getMonth() - today.getMonth());
      diffMonths = Math.max(1, diffMonths);

      document.getElementById('goalRemainingMonths').textContent = `${diffMonths} Monate`;

      // Zinseszins-Prognose (Monatliche Verzinsung)
      const monthlyRate = (g.interestRate || 0) / 100 / 12;
      let balanceForecast = Number(g.startCapital) || 0;
      const safeSurplus = Math.max(0, monthlySurplus);

      for (let m = 0; m < diffMonths; m++) {
        balanceForecast = (balanceForecast + safeSurplus) * (1 + monthlyRate);
      }

      document.getElementById('goalForecastVal').textContent = formatEUR(balanceForecast);

      // Erforderliche monatliche Sparrate ermitteln
      let requiredMonthlyRate = 0;
      if (monthlyRate === 0) {
        requiredMonthlyRate = Math.max(0, (g.target - g.startCapital) / diffMonths);
      } else {
        const factor = Math.pow(1 + monthlyRate, diffMonths);
        const numerator = g.target - (g.startCapital * factor);
        const denominator = ((factor - 1) / monthlyRate) * (1 + monthlyRate);
        requiredMonthlyRate = Math.max(0, numerator / denominator);
      }

      document.getElementById('goalRequiredRate').textContent = formatEUR(requiredMonthlyRate);
    }

    function initGoalEditorInputs() {
      const g = state.savingsGoal;
      document.getElementById('goalTitleInput').value = g.title;
      document.getElementById('goalTargetInput').value = g.target;
      document.getElementById('goalStartInput').value = g.startCapital;
      document.getElementById('goalDateInput').value = g.targetDate;
      document.getElementById('goalRateInput').value = g.interestRate;

      const bind = (id, key, isNum) => {
        document.getElementById(id).addEventListener('input', (e) => {
          g[key] = isNum ? (parseFloat(e.target.value) || 0) : e.target.value;
          persistState();
          renderKPIs();
        });
      };

      bind('goalTitleInput', 'title', false);
      bind('goalTargetInput', 'target', true);
      bind('goalStartInput', 'startCapital', true);
      bind('goalDateInput', 'targetDate', false);
      bind('goalRateInput', 'interestRate', true);
    }

    /* ==========================================================================
       8. Offline Systemuhr (Sekundengenau)
       ========================================================================== */
    function updateClock() {
      const now = new Date();
      document.getElementById('dateBadge').textContent = now.toLocaleDateString('de-DE', {
        day: '2-digit', month: '2-digit', year: 'numeric'
      });
      document.getElementById('timeBadge').textContent = now.toLocaleTimeString('de-DE', {
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    }

    /* ==========================================================================
       9. Event-Listener & Initialisierung
       ========================================================================== */
    function renderApp() {
      renderKPIs();
      renderIncomes();
      renderCategories();
    }

    // Umschalter: Monat / Jahr
    const btnMonth = document.getElementById('btnMonth');
    const btnYear = document.getElementById('btnYear');

    btnMonth.addEventListener('click', () => {
      currentViewMode = 'month';
      btnMonth.classList.add('active');
      btnYear.classList.remove('active');
      renderApp();
    });

    btnYear.addEventListener('click', () => {
      currentViewMode = 'year';
      btnYear.classList.add('active');
      btnMonth.classList.remove('active');
      renderApp();
    });

    // Editor-Modus umschalten
    const btnToggleMode = document.getElementById('btnToggleMode');
    btnToggleMode.addEventListener('click', () => {
      isEditorActive = !isEditorActive;
      document.body.classList.toggle('editor-active', isEditorActive);
      btnToggleMode.textContent = isEditorActive ? '✔️ Ansichtsmodus' : '⚙️ Editor-Modus';
      renderApp();
    });

    // Einnahmen hinzufügen
    document.getElementById('btnAddIncome').addEventListener('click', () => {
      state.incomes.push({
        id: `inc_${Date.now()}`,
        name: 'Neues Einkommen',
        value: 0
      });
      persistState();
      renderApp();
    });

    // Kategorie hinzufügen
    document.getElementById('btnAddCategory').addEventListener('click', () => {
      state.categories.push({
        id: `cat_${Date.now()}`,
        name: 'Neue Kategorie',
        color: '#3b82f6',
        items: []
      });
      persistState();
      renderApp();
    });

    // Reset auf leeres 0-€-Template
    document.getElementById('btnResetDemo').addEventListener('click', () => {
      if (confirm('Möchtest du alle Slider und Einnahmen wirklich auf 0 € zurücksetzen?')) {
        state = getDefaultData();
        // Alle Werte auf 0 setzen
        state.incomes.forEach(i => i.value = 0);
        state.categories.forEach(c => c.items.forEach(it => it.value = 0));
        state.savingsGoal.startCapital = 0;
        persistState();
        renderApp();
      }
    });

    // Initialer Start
    setInterval(updateClock, 1000);
    updateClock();
    initGoalEditorInputs();
    renderApp();
  </script>
</body>
</html>
